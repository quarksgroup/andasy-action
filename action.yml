name: andasy-action
author: Andasy Labs
description: The andasy Github action for deploying application to andasy platform.
branding:
  icon: "upload-cloud"
  color: "purple"
inputs:
  build_mode:
    description: "Build mode to use between remote, or local (Docker runtime in Github Actions)"
    default: "local"
  project_path:
    description: "Specify a directory to deploy relative to the root of your respository. root directory used by default."
    default: ""
runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Setup andasy CLI
      shell: bash
      run: |
        set -euo pipefail
        log=$(mktemp)
        if ! curl -sSL https://andasy.io/install.sh 2>&1 | sh > "$log" 2>&1; then
          echo "Andasy CLI install failed. Install output:"
          cat "$log"
          exit 1
        fi
        rm "$log"
        echo "$HOME/.andasy/bin" >> $GITHUB_PATH

    - name: Deploy to Andasy
      shell: bash
      env:
        ANDASY_ACCESS_TOKEN: ${{ env.ANDASY_ACCESS_TOKEN }}
        INPUT_BUILD_MODE: ${{ inputs.build_mode }}
        INPUT_PROJECT_PATH: ${{ inputs.project_path }}
      run: |
        set -euo pipefail

        export DOCKER_BUILDKIT=1

        PREV_PATH=""

        if ! [ -n "$ANDASY_ACCESS_TOKEN" ]; then
          echo "ANDASY_ACCESS_TOKEN is missing."
          echo "visit https://github.com/quarksgroup/andasy-action/blob/main/README.md#prerequisites."
          exit 1
        fi

        if [ -n "$INPUT_PROJECT_PATH" ]; then
          PREV_PATH=$(pwd)
          cd "$INPUT_PROJECT_PATH"
          echo "Running deploy inside $INPUT_PROJECT_PATH"
        fi

        STRATEGY="local"

        if [ -n "$INPUT_BUILD_MODE" ]; then
          if [ "$INPUT_BUILD_MODE" = "remote" ]; then
            echo "Using remote builder"
            STRATEGY="remote"
          fi
        fi

        DEFAULT_DOCKER_SOCK="/var/run/docker.sock"

        if ! [ -S "$DEFAULT_DOCKER_SOCK" ]; then
          if [ "$STRATEGY" = "local" ]; then
            echo "Local docker daemon doesn't seem to be up. Fallback to remote builder."
            STRATEGY="remote"
          fi
        fi

        if ! [ -f "andasy.hcl" ]; then
          if ! [ -f "config.hcl" ]; then
            echo "andasy.hcl with existing app name is required."
            echo 'Generate it by running "andasy setup" inside your project.'
            exit 1
          fi
        fi

        if ! [ -f "Dockerfile" ]; then
          echo "Dockerfile of your project is required."
          echo 'Generate it by running "andasy setup" inside your project.'
          exit 1
        fi

        andasy deploy -m "$STRATEGY"

        ACTUAL_EXIT=$?

        if [ -n "$PREV_PATH" ]; then
          cd "$PREV_PATH"
        fi

        exit $ACTUAL_EXIT
